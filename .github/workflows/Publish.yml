# Human friendly display name for this workflow
name: Deploy - Azure Static Web App

# Event listeners for when the job should start execution
on:
    # Triggers the workflow on push or pull request events to the main branch
    push:
        branches: [main]

    # Run automatically when a release is published (stable or pre-release)
    release:
        types: [published]

# Set of execution sessions that are part of this workflow
jobs:
  # Build the static HTML so that it can be deployed to Azure
  Build-Artifact:
      # Display name of the job
      name: Build - Artifact

      # Sets the scopes available to the github_token injected to the GH Actions runner
      permissions:
          attestations: write
          contents: read
          id-token: write

      # Execute the workflow
      uses: ./.github/workflows/Build.yml

  # Calculates the tag and channel metadata based on the event that triggered the workflow, and making that data available to downstream jobs through outputs.
  Deploy-Metadata:
      # Human friendly display name for the job
      name: Calculate Deployment Metadata

      # Operating system that the job will run on
      runs-on: ubuntu-slim

      # Sets the scopes available to the github_token injected to the GH Actions runner
      permissions:
          # Read the files in the repository to be able to compute the version from the package.json.
          contents: read

      # Set of data that will be made available to downstream jobs.
      outputs:
          channel: ${{ steps.computedChannel.outputs.channel }}
          environment: ${{ steps.computedGitHubEnvironment.outputs.environment }}

      # Set of actions to perform for this execution sandbox
      steps:
        # Download the source code
        - name: Checkout Files from Repo
          uses: actions/checkout@v6

        # Set the experimental tag to indicate if it is an Alpha or Beta build
        - name: Compute Channel
          id: computedChannel
          run: |
              if [ "${{ github.event_name }}" = "release" ] && [ "${{ github.event.release.prerelease }}" = "true" ]; then
                echo "channel=beta" >> "$GITHUB_OUTPUT"
              elif [ "${{ github.event_name }}" = "release" ]; then
                echo "channel=stable" >> "$GITHUB_OUTPUT"
              else
                echo "channel=alpha" >> "$GITHUB_OUTPUT"
              fi

        # Compute the GitHub Environment to be used by the deployment
        - name: Compute GitHub Environment
          id: computedGitHubEnvironment
          run: |
              if [ "${{ github.event_name }}" = "release" ]; then
                echo "environment=Azure-Privileged" >> "$GITHUB_OUTPUT"
              else
                echo "environment=Azure-Alpha" >> "$GITHUB_OUTPUT"
              fi

  # Single deploy job since we're just deploying
  Deploy-Static-Web-App:
    # Human friendly display name for the job
    name: Deploy to Azure Static App

    # Define the OS that should be used during workflow execution
    runs-on: ubuntu-latest

    # Sets the scopes available to the github_token injected to the GH Actions runner
    permissions:
      attestations: read
      contents: read
      id-token: write

    # Ensure that the artifact is built before attempting to deploy it to the Azure Static Web App
    needs: [Build-Artifact, Deploy-Metadata]

    # Select the appropriate environment to deploy to based on whether this is a stable release or not.
    environment: ${{ needs.Deploy-Metadata.outputs.environment }}

    # Set of commands to run as part of the execution process
    steps:
      # Download the source code
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: private.staticwebapp.config.json

      # Make Node Binaries available to the action
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
            node-version: 24

      # Installs the Azure Static Web App CLI to enable deployment to the Azure Static Web App service
      - name: Install Azure Static Web App CLI
        run: npm install -g @azure/static-web-apps-cli

      # Downloads the compiled UI artifact from the Build workflow
      - name: Download UI Build Artifact
        uses: actions/download-artifact@v8
        with:
            name: Documentation

      # Validate the attestation of the downloaded artifact to prevent tamper
      - name: Validate Attestation
        env:
            GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: gh attestation verify docs.zip --repo Software-Hardware-Integration-Lab/Documentation --signer-workflow Software-Hardware-Integration-Lab/Documentation/.github/workflows/Build.yml@${{ github.event_name == 'release' && format('refs/tags/{0}', github.ref_name) || 'refs/heads/main' }}

      # Extract the zip file and remove the container
      - name: Unzip UI Artifact
        run: unzip docs.zip -d out && rm docs.zip

      # OIDC authenticate to Entra ID to be able to deploy to the Azure Static Web App service
      - name: Log into Entra ID with OIDC
        uses: azure/login@v3
        with:
            client-id: ${{ secrets.CLIENT_ID }}
            tenant-id: ${{ secrets.TENANT_ID }}
            subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      # Retrieve the deployment token from the specific Azure Static Web App
      - name: Retrieve Deploy Token for Azure Static Web App
        id: swaPublishToken
        run: |
            token=$(az StaticWebApp secrets list --name Docs-${{ needs.Deploy-Metadata.outputs.channel }} --resource-group Docs --query "properties.apiKey" -o tsv)
            echo "::add-mask::$token"
            echo "token=$token" >> "$GITHUB_OUTPUT"

      # Copies the config that enforces auth to the deploy folder to ensure it is included in the upload process
      - name: Copy Private Static Web App Configuration
        if: needs.Deploy-Metadata.outputs.channel == 'alpha'
        run: cp private.staticwebapp.config.json ./out/staticwebapp.config.json

      # Deploy the compiled HTML to the Azure Static Web App using the deployment token for authentication
      - name: Deploy to Azure Static Web App
        run: swa deploy ./out/ --app-name Docs-${{ needs.Deploy-Metadata.outputs.channel }} --env Production --deployment-token ${{ steps.swaPublishToken.outputs.token }}

      # Ensure that the deployment token is kept a secret and not leaked from this job
      - name: Rotate Deploy Token
        run: az StaticWebApp secrets reset-api-key --name Docs-${{ needs.Deploy-Metadata.outputs.channel }}

  Update-RAG:
    # Human friendly display name for the job
    name: Update Data Gateway RAG DB

    # Define the OS that should be used during workflow execution
    runs-on: ubuntu-slim

    # Least permissions required to issue the update command to Data Gateway
    permissions:
      id-token: write

    # Ensure that the artifact is built before attempting to deploy it to the Azure Static Web App
    needs: [Deploy-Metadata]

    # Only update the RAG DB for stable releases since that's what the public documentation site is based on
    if: needs.Deploy-Metadata.outputs.channel == 'stable'

    # Select the appropriate environment to deploy to based on whether this is a stable release or not.
    environment: ${{ needs.Deploy-Metadata.outputs.environment }}

    # Set of commands to run as part of the execution process
    steps:
      # Log into the Entra ID with the GitHub federated identity credential (using the OIDC token)
      - name: Login to Entra ID
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          allow-no-subscriptions: true

      # Get the access token for the update command for Data Gateway
      - name: Get Access Token - SHI - Data Gateway
        id: sdgAccessToken
        run: |
          sdgAccessToken=$(az account get-access-token --resource=4c40281b-a305-4aaf-90a4-d5bbee6eb8ed --query accessToken -o tsv)
          echo "::add-mask::$sdgAccessToken"
          echo "sdgAccessToken=$sdgAccessToken" >> "$GITHUB_OUTPUT"

      # Open a port and assign admin to the Azure SQL DB Service to allow the migration scripts to run
      - name: Issue RAG DB Regeneration Command
        shell: pwsh
        run: |
          # Issue the RAG update command to Data Gateway
          Invoke-RestMethod -Method 'Post' -Uri 'https://api.shilab.com/Api/Chat/UpdateDocs' -Headers @{Authorization = "Bearer ${{ steps.sdgAccessToken.outputs.sdgAccessToken}}"}
